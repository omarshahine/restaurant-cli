name: Publish to ClawHub

# Triggered on `vX.Y.Z` tag push. ClawHub auto-indexes the npm package via
# its `openclaw-plugin` keyword, but this workflow publishes the packaged
# plugin directly so the hub's version listing matches the tag/commit.
#
# Requires the `CLAWHUB_TOKEN` repo secret (Settings → Secrets and variables
# → Actions). Get the token via `clawhub login` locally and paste it in.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to ClawHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install clawhub CLI
        # Pinned to match the local CLI used to mint CLAWHUB_TOKEN. Major
        # version drift between local (token-issuer) and CI (token-verifier)
        # caused v0.1.1 publish attempts to fail with `Unauthorized`.
        run: npm install -g clawhub@0.12.2

      - name: Authenticate
        run: clawhub login --token "${{ secrets.CLAWHUB_TOKEN }}" --no-browser

      - name: Install + build (so dist/ exists before clawhub's prod install)
        # ClawHub's publish runs its own `npm install --production` on the
        # tarball, which fires our `prepare` hook. The hook calls
        # `npm run build` (tsup) which isn't available without devDeps. We
        # build dist/ here so the prepare hook short-circuits via
        # `test -d dist`.
        run: |
          npm ci
          npm run build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog from tag annotation
        id: changelog
        run: |
          MSG=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ -z "$MSG" ] || [ "$MSG" = "$GITHUB_REF_NAME" ]; then
            MSG=$(git log -1 --format='%s')
          fi
          echo "text=$MSG" >> "$GITHUB_OUTPUT"

      - name: Publish to ClawHub
        run: |
          clawhub package publish . \
            --family code-plugin \
            --name restaurant-cli \
            --display-name Restaurant \
            --version "${{ steps.version.outputs.version }}" \
            --changelog "${{ steps.changelog.outputs.text }}" \
            --tags "latest" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref_name }}"

      - name: Verify
        run: clawhub package inspect restaurant-cli
