name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
        with:
          # pnpm 10+ is required: pnpm-workspace.yaml here is a settings-only
          # file (allowBuilds / minimumReleaseAgeExclude) with no `packages`
          # field. pnpm 9 rejects that ("packages field missing or empty")
          # when actions/setup-node's `cache: pnpm` runs `pnpm store path`.
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
