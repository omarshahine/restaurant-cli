name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # pnpm 10+ is required: pnpm-workspace.yaml here is a settings-only
          # file (allowBuilds / minimumReleaseAgeExclude) with no `packages`
          # field. pnpm 9 rejects that ("packages field missing or empty")
          # when actions/setup-node's `cache: pnpm` runs `pnpm store path`.
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
