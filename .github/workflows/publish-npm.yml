name: Publish to NPM

# Fires on `vX.Y.Z` tag push. Publishes restaurant-cli to the public npm
# registry via npm's Trusted Publisher (OIDC) — no NPM_TOKEN needed.
#
# Trust is established at https://www.npmjs.com/package/restaurant-cli/access
# pointing at this workflow file (publish-npm.yml). The first publish was
# done manually from a maintainer machine; every publish after that flows
# through this workflow.
#
# `id-token: write` is required for npm to verify the OIDC token and
# `--provenance` records the build's source-of-truth (commit SHA, workflow
# run, runner) on the registry so consumers can verify the package wasn't
# tampered with after CI.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish restaurant-cli to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Assert tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Verify package contents
        run: |
          npm run build
          npm run typecheck
          npm run test
          npm pack --dry-run

      - name: Publish to NPM (with provenance via OIDC)
        # prepublishOnly fires here too (build + typecheck + test), so the
        # above "Verify" step is technically redundant — we keep it
        # explicit for clearer CI logs when something regresses.
        run: npm publish --access public --provenance
