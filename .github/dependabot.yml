version: 2
# Grouped and monthly on purpose: ungrouped weekly updates across this
# fleet would be dozens of PRs a week. One PR per ecosystem per month
# is something a person can actually read.
updates:
  # The real supply-chain surface: these workflows carry signing certs,
  # notarization credentials and publish tokens.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: deps
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # ⚠️ Security updates are NOT grouped by default, so a repo with three
      # advisories in one lockfile gets three PRs that all edit it. Merging any
      # one invalidates the other two, `@dependabot recreate` rebuilds them,
      # and the next merge breaks them again -- a loop this fleet actually hit
      # on Lobster, findmy-cli and openclaw-parcel. One PR per directory ends it.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      production:
        dependency-type: production
      # typescript moves ahead of the tools built on its API: typescript-eslint
      # peer-caps it (>=4.8.4 <6.1.0) and rollup-plugin-dts links its internals.
      # Bundled into one dev group it took the healthy updates down with it, so
      # it gets its own PR and fails alone and visibly instead.
      typescript:
        patterns:
          - "typescript"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      types:
        patterns:
          - "@types/*"
      development:
        dependency-type: development
        exclude-patterns:
          - "typescript"
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "@types/*"
    commit-message:
      prefix: deps
